[project]
name = "ego-os-agent"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "The ego-OS Authors" }]
readme = "README.md"
description = "ego-OS tenant agent: pushes your vault and runs your enrichment on your own Claude login"
requires-python = ">=3.11"
dependencies = [
    "ego-os-core",
]

[project.urls]
Homepage = "https://github.com/XxMorganxX/Ego-OpenSource"
Repository = "https://github.com/XxMorganxX/Ego-OpenSource"
Issues = "https://github.com/XxMorganxX/Ego-OpenSource/issues"
Changelog = "https://github.com/XxMorganxX/Ego-OpenSource/blob/main/CHANGELOG.md"

[project.scripts]
kb-agent = "kb_agent.cli:main"

[tool.uv.sources]
ego-os-core = { path = "../KB_Core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_agent"]

[dependency-groups]
dev = ["pytest>=8"]
