[project]
name = "ego-os-retrieval"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "The ego-OS Authors" }]
readme = "README.md"
description = "Retrieval strategies behind one contract, over the ego-OS engine (kb_core)"
requires-python = ">=3.11"
dependencies = [
    "ego-os-core",
]

[project.urls]
Homepage = "https://github.com/XxMorganxX/Ego-OpenSource"
Repository = "https://github.com/XxMorganxX/Ego-OpenSource"
Issues = "https://github.com/XxMorganxX/Ego-OpenSource/issues"
Changelog = "https://github.com/XxMorganxX/Ego-OpenSource/blob/main/CHANGELOG.md"

# ego-os-core (KB_Core, import package kb_core) is the sibling engine package;
# consumed as an editable path dependency.
[tool.uv.sources]
ego-os-core = { path = "../KB_Core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_retrieval"]
