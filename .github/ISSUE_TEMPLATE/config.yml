# Issue chooser: only the bug and feature forms, no blank issues. Security reports
# never go through a public issue — see SECURITY.md.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://docs.github.com/en/code-security/security-advisories/guidance-on-reporting-and-writing-information-about-vulnerabilities/privately-reporting-a-security-vulnerability
    about: >-
      Please don't open a public issue. Use this repository's Security tab and choose
      "Report a vulnerability" (the link explains how); SECURITY.md has the details.
