[project]
name = "ego-os-core"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "The ego-OS Authors" }]
description = "Hierarchical knowledge-base engine: storage, ingestion, enrichment, migrations, and the dashboard API"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "python-frontmatter>=1.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.40",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "html2text>=2024.2",
    "pyjwt[crypto]>=2.8",
]

[project.urls]
Homepage = "https://github.com/XxMorganxX/Ego-OpenSource"
Repository = "https://github.com/XxMorganxX/Ego-OpenSource"
Issues = "https://github.com/XxMorganxX/Ego-OpenSource/issues"
Changelog = "https://github.com/XxMorganxX/Ego-OpenSource/blob/main/CHANGELOG.md"

[project.scripts]
# Command names preserved so existing cron/launchd/scripts keep working;
# they now resolve to the kb_core package.
kb-mcp-sync = "kb_core.cli:main"
kb-mcp-ingestd = "kb_core.ingest.daemon:main"
kb-mcp-reanalyzed = "kb_core.analysis.daemon:main"
kb-mcp-entity-resolved = "kb_core.entity_resolve_daemon:main"
kb-dashboard-api = "dashboard.api.app:main"
kb-reset-entities = "kb_core.reset_entities:main"
kb-prune-instances = "kb_core.prune_instances:main"
kb-denoise-instances = "kb_core.denoise_instances:main"
kb-embed-backfill = "kb_core.embed_backfill:main"
kb-consolidate = "kb_core.consolidate_cli:main"
kb-mcp-consolidated = "kb_core.consolidate_daemon:main"
kb-healthcheck = "kb_core.healthcheck:main"
kb-tenant = "kb_core.tenant_cli:main"
kb-agent-gateway = "kb_core.gateway.app:main"
kb-backup = "kb_core.backup:main"
kb-entity-hygiene = "kb_core.entity_hygiene:main"
kb-check-publishable = "kb_core.publish.check:main"
kb-publish = "kb_core.publish.cli:main"
kb-import-pr = "kb_core.publish.import_pr:main"
kb-run = "kb_core.run_stack:main"
kb-policy = "kb_core.policy:main"
kb-turns-rebuild = "kb_core.turns_rebuild:main"
kb-library = "kb_core.library_client:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The dashboard web UI lives in the KB_Frontend directory of this repository; only the
# Python API package ships in the wheel alongside the engine.
[tool.hatch.build.targets.wheel]
packages = ["src/kb_core", "dashboard"]
